<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gacha Daily Tracker — Status</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/public/images/favicon-96x96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/public/images/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#080808">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080808;
      --bg2: #0d0b08;
      --bg3: #111009;
      --surface: #18140d;
      --border: rgba(200,155,60,0.12);
      --border2: rgba(200,155,60,0.28);
      --gold: #c8913c;
      --gold-bright: #e8c86a;
      --gold-dim: #8a6020;
      --cyan: #06b6d4;
      --green: #10b981;
      --red: #ef4444;
      --amber: #f59e0b;
      --text: #f0ede8;
      --text2: #9a8570;
      --text3: #4a3d2a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAV */
    nav {
      height: 52px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 2rem;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav-right { justify-self: end; }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .logo-text {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .logo-text span { color: var(--gold-bright); }

    .nav-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 100px;
      background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.25);
      color: var(--green);
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pulse-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-right a {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text3);
      text-decoration: none;
      transition: color 0.2s;
      letter-spacing: 0.04em;
    }

    .nav-right a:hover { color: var(--gold-bright); }

    /* HERO */
    .hero {
      position: relative;
      padding: 4rem 2rem 3rem;
      text-align: center;
      overflow: hidden;
    }

    .hero-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(200,155,60,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200,155,60,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 80% at 50% 40%, black 30%, transparent 100%);
    }

    .hero-orb {
      position: absolute;
      width: 400px; height: 250px;
      background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(200,155,60,0.07) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(60px);
      top: -60px; left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .page-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: var(--gold-bright);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 1rem;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .page-eyebrow::before, .page-eyebrow::after {
      content: '';
      width: 24px; height: 1px;
      background: var(--gold-bright);
      opacity: 0.5;
    }

    .page-title {
      font-size: clamp(1.75rem, 4vw, 2.75rem);
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.05;
      position: relative;
      margin-bottom: 0.75rem;
    }

    .page-sub {
      font-size: 14px;
      color: var(--text2);
      position: relative;
      font-weight: 400;
    }

    /* OVERALL STATUS PILL */
    .overall-wrap {
      display: flex;
      justify-content: center;
      margin: 2rem 0 0.75rem;
      position: relative;
    }

    /* status.js sets class on #overallStatus — keep both states */
    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      border-radius: 100px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      border: 1px solid rgba(16,185,129,0.3);
      background: rgba(16,185,129,0.08);
      color: var(--green);
      transition: all 0.3s;
    }

    .status-indicator.error,
    .status-indicator.status-error {
      border-color: rgba(239,68,68,0.3);
      background: rgba(239,68,68,0.08);
      color: var(--red);
    }

    .status-indicator.status-operational { /* already the default green */ }

    .loading { opacity: 0.6; pointer-events: none; transition: opacity 0.3s; }

    .status-indicator .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s ease-in-out infinite;
    }

    .status-indicator.error .dot,
    .status-indicator.status-error .dot {
      background: var(--red);
      animation: none;
    }

    .timestamp-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text3);
      position: relative;
      margin-bottom: 3rem;
      text-align: center;
    }

    /* MAIN CONTENT */
    .content {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 2rem 4rem;
      flex: 1;
      width: 100%;
    }

    /* SERVICES GRID — status.js injects .service divs here */
    #services {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 2rem;
    }

    /* These classes are applied by status.js to injected elements */
    .service {
      background: var(--bg2);
      padding: 1.75rem;
      transition: background 0.2s;
      position: relative;
    }

    .service:hover { background: var(--bg3); }

    .service::after {
      content: '';
      position: absolute;
      bottom: 0; left: 1.75rem; right: 1.75rem;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(200,155,60,0.3), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .service:hover::after { opacity: 1; }

    .service.error::after {
      background: linear-gradient(90deg, transparent, rgba(239,68,68,0.3), transparent);
    }

    .service h3 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
      margin-bottom: 6px;
    }

    .service-status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      color: var(--green);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .service-status::before {
      content: '';
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--green);
    }

    .service.error .service-status {
      color: var(--red);
    }

    .service.error .service-status::before {
      background: var(--red);
    }

    /* REFRESH BUTTON */
    .refresh-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 1rem;
    }

    #refreshBtn {
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--gold-bright);
      background: rgba(200,155,60,0.08);
      border: 1px solid rgba(200,155,60,0.2);
      padding: 9px 22px;
      border-radius: 7px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: color 0.2s, background 0.2s, border-color 0.2s;
      letter-spacing: 0.01em;
    }

    #refreshBtn:hover {
      background: rgba(200,155,60,0.15);
      border-color: rgba(200,155,60,0.35);
    }

    #refreshBtn.loading {
      opacity: 0.5;
      pointer-events: none;
    }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 860px;
      margin: 0 auto;
      width: 100%;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .footer-copy {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text3);
    }

    .footer-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .footer-links a {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text3);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-links a:hover { color: var(--gold-bright); }

    @media (max-width: 600px) {
      #services { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <a class="nav-logo" href="/gdt/">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
      <rect width="22" height="22" rx="5.5" fill="#c8913c" opacity="0.15"/>
      <circle cx="11" cy="11" r="4" stroke="#c8913c" stroke-width="1.3" fill="none"/>
      <circle cx="11" cy="11" r="1.3" fill="#e8c86a"/>
      <path d="M11 3v2.5M11 16.5V19M3 11h2.5M16.5 11H19" stroke="#c8913c" stroke-width="1.3" stroke-linecap="round" opacity="0.5"/>
    </svg>
    <span class="logo-text">Gacha<span>Daily</span>Tracker</span>
  </a>
  <span class="nav-badge">
    <span class="pulse-dot"></span>
    status
  </span>
  <div class="nav-right">
    <a href="/gdt/">API Home</a>
    <a href="/gdt/api-docs">Docs</a>
    <a href="/gdt/health">Health</a>
    <a href="https://gachadailytracker.com">Main Site</a>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-grid"></div>
  <div class="hero-orb"></div>

  <div class="page-eyebrow">system health</div>
  <h1 class="page-title">API Status</h1>
  <p class="page-sub">Real-time health monitoring for all services</p>
</section>

<!-- STATUS INDICATOR -->
<div class="overall-wrap">
  <div class="status-indicator" id="overallStatus">
    <span class="dot"></span>
    <span id="statusText">Checking...</span>
  </div>
</div>

<p class="timestamp-text" id="timestamp">Checking system status...</p>

<!-- SERVICES + REFRESH -->
<div class="content" id="statusCard">
  <div id="services">
    <!-- Populated by status.js -->
  </div>

  <div class="refresh-wrap">
    <button id="refreshBtn">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
        <path d="M11.5 6.5A5 5 0 1 1 9 2.07" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M9 1v3h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Refresh Status
    </button>
  </div>
</div>

<!-- FOOTER -->
<footer>
  <span class="footer-copy">Last updated: <span id="lastUpdated">—</span></span>
  <ul class="footer-links">
    <li><a href="/gdt/api-docs">API Docs</a></li>
    <li><a href="/gdt/">API Home</a></li>
    <li><a href="https://github.com/pmadin/GachaDailyTracker">GitHub</a></li>
    <li><a href="https://gachadailytracker.com">Main Site</a></li>
  </ul>
</footer>

<script src="/public/status.js"></script>
</body>
</html>
